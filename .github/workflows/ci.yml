name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Suíte de testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none

      - name: Instalar dependências do Composer
        working-directory: ./src
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar arquivo de ambiente
        working-directory: ./src
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Instalar dependências do Node
        working-directory: ./src
        run: npm ci

      - name: Compilar assets
        working-directory: ./src
        run: npm run build

      - name: Executar a suíte de testes
        working-directory: ./src
        run: php artisan test

  deploy:
    name: Deploy (simulado)
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Simular publicação
        run: |
          echo "Testes aprovados. Iniciando deploy..."
          echo "Deploy concluído com sucesso."